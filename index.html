<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: a notched phone gives the game its whole screen; the touch layout keeps out of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111b1c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Added to a phone's home screen, the game opens without the browser's bars, held sideways. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="San Andreas" />
    <title>San Andreas · Grove Street</title>
    <script>
      // The start package (src/assets/includedScenes.ts) is what the play button waits on. Request it with the page
      // rather than once the game's scripts, physics included, have downloaded; boot() takes the response over.
      if (!new URLSearchParams(location.search).has('sceneTest')) {
        const url = new URL('%BASE_URL%play/world-start.scene.bin', location.href).href;
        const response = fetch(url);
        response.catch(() => {});
        window.__startScenePack = { url, response };
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
